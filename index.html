<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f6f7f2">
  <title>Sudoku — a little daily puzzle</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #24352f;
      --muted: #829089;
      --green: #2c755c;
      --green-dark: #205943;
      --mint: #e7f2eb;
      --paper: #fffefa;
      --line: #dce2dc;
      --strong-line: #82968b;
      --red: #c65a51;
      --shadow: 0 16px 48px rgb(34 57 45 / 8%);
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(ellipse at 50% 0%, #edf4ed 0, transparent 47rem),
        #f6f7f2;
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, select { font: inherit; }
    button { color: inherit; }

    .app {
      width: min(100% - 32px, 620px);
      margin: 0 auto;
      padding: 38px 0 30px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 26px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      display: grid;
      width: 42px;
      height: 42px;
      place-items: center;
      border-radius: 13px;
      background: var(--green);
      color: white;
      font-size: 23px;
      font-weight: 750;
      letter-spacing: -3px;
      padding-right: 3px;
    }

    .brand-name { font-size: 16px; font-weight: 750; letter-spacing: -.3px; }
    .brand-caption { margin-top: 2px; color: var(--muted); font-size: 12px; }

    .game-card {
      padding: 27px;
      border: 1px solid rgb(222 228 220 / 85%);
      border-radius: 22px;
      background: var(--paper);
      box-shadow: var(--shadow);
    }

    .game-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    h1 { margin: 0; font-size: clamp(24px, 5vw, 30px); letter-spacing: -1px; }
    .subtitle { margin: 6px 0 0; color: var(--muted); font-size: 13px; }

    .difficulty {
      min-height: 39px;
      padding: 0 30px 0 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
    }

    .board-wrap { position: relative; }

    .board {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      overflow: hidden;
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid var(--strong-line);
      border-radius: 10px;
      background: #fff;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .cell {
      position: relative;
      display: grid;
      min-width: 0;
      place-items: center;
      padding: 0;
      border: 0;
      border-right: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      background: #fff;
      color: var(--green);
      font-size: clamp(17px, 5.2vw, 28px);
      font-weight: 550;
      cursor: pointer;
    }

    .cell:nth-child(9n) { border-right: 0; }
    .cell:nth-child(n+73) { border-bottom: 0; }
    .cell:nth-child(3n):not(:nth-child(9n)) { border-right: 2px solid var(--strong-line); }
    .cell:nth-child(n+19):nth-child(-n+27),
    .cell:nth-child(n+46):nth-child(-n+54) { border-bottom: 2px solid var(--strong-line); }
    .cell.given { color: var(--ink); font-weight: 720; }
    .cell.related { background: #f2f6f1; }
    .cell.same-number { background: #e6f0e9; }
    .cell.selected { z-index: 1; background: #dcece1; box-shadow: inset 0 0 0 2px var(--green); }
    .cell.conflict { color: var(--red); background: #fff0ed; }
    .cell:focus-visible { z-index: 2; outline: 3px solid #38876a; outline-offset: -3px; }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 54px;
      gap: 12px;
      color: var(--muted);
      font-size: 13px;
    }

    .status-message { color: var(--ink); font-weight: 600; }
    .status-message.error { color: var(--red); }
    .timer { font-variant-numeric: tabular-nums; white-space: nowrap; }

    .number-pad {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 7px;
    }

    .number-button {
      min-width: 0;
      height: 48px;
      border: 1px solid #e4e9e3;
      border-radius: 10px;
      background: #fff;
      color: var(--green-dark);
      font-size: 19px;
      font-weight: 650;
      cursor: pointer;
      transition: background .15s, transform .15s;
    }

    .number-button:hover:not(:disabled) { transform: translateY(-1px); background: var(--mint); }
    .number-button:disabled { color: #b6c0b9; background: #f8f9f6; cursor: default; }

    .actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 16px;
    }

    .action-group { display: flex; gap: 8px; }

    .action-button {
      display: inline-flex;
      min-height: 41px;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: white;
      font-size: 13px;
      font-weight: 650;
      cursor: pointer;
    }

    .action-button:hover { background: #f5f8f3; }
    .action-button.primary { border-color: var(--green); background: var(--green); color: white; }
    .action-button.primary:hover { background: var(--green-dark); }
    .action-button:focus-visible, .difficulty:focus-visible, .number-button:focus-visible { outline: 3px solid #8cc7a5; outline-offset: 2px; }

    .help {
      margin: 16px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
    }

    .modal {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      border-radius: 9px;
      background: rgb(255 254 250 / 91%);
      text-align: center;
      backdrop-filter: blur(3px);
    }

    .modal[hidden] { display: none; }
    .modal h2 { margin: 0; font-size: 27px; letter-spacing: -.8px; }
    .modal p { margin: 7px 0 16px; color: var(--muted); font-size: 14px; }

    footer { padding-top: 17px; color: #98a39c; font-size: 11px; text-align: center; }

    @media (max-width: 480px) {
      .app { width: min(100% - 20px, 620px); padding-top: 21px; }
      .game-card { padding: 16px 13px 15px; border-radius: 17px; }
      header { margin-bottom: 18px; }
      .game-heading { margin-bottom: 14px; }
      .number-pad { gap: 5px; }
      .number-button { height: 44px; border-radius: 8px; }
      .action-button { min-height: 39px; padding: 0 9px; font-size: 12px; }
      .status-row { min-height: 47px; font-size: 12px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="brand" aria-label="Sudoku, a little daily puzzle">
        <div class="brand-mark" aria-hidden="true">9×</div>
        <div>
          <div class="brand-name">little sudoku</div>
          <div class="brand-caption">A little pause for your brain</div>
        </div>
      </div>
    </header>

    <section class="game-card" aria-labelledby="game-title">
      <div class="game-heading">
        <div>
          <h1 id="game-title">Sudoku</h1>
          <p class="subtitle">A fresh puzzle, just for you.</p>
        </div>
        <label>
          <span class="sr-only" hidden>Difficulty</span>
          <select class="difficulty" id="difficulty" aria-label="Puzzle difficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </label>
      </div>

      <div class="board-wrap">
        <div class="board" id="board" role="grid" aria-label="Sudoku puzzle"></div>
        <div class="modal" id="win-modal" role="status" aria-live="polite" hidden>
          <div>
            <h2>Lovely work!</h2>
            <p>You solved it in <span id="final-time"></span>.</p>
            <button class="action-button primary" id="play-again">Play another</button>
          </div>
        </div>
      </div>

      <div class="status-row">
        <span class="status-message" id="message" aria-live="polite">Pick a square to get started</span>
        <span class="timer" id="timer" aria-label="Elapsed time">00:00</span>
      </div>

      <div class="number-pad" id="number-pad" aria-label="Enter a number"></div>

      <div class="actions">
        <div class="action-group">
          <button class="action-button" id="erase" aria-label="Erase selected square">⌫ <span>Erase</span></button>
          <button class="action-button" id="hint" aria-label="Reveal a number">✦ <span>Hint</span></button>
        </div>
        <button class="action-button primary" id="new-game">New game <span aria-hidden="true">↗</span></button>
      </div>
      <p class="help">Choose a square, then tap a number or use your keyboard. Each row, column, and box needs 1–9.</p>
    </section>
    <footer>Take your time. There’s nowhere else to be.</footer>
  </main>

  <script>
    (() => {
      "use strict";

      const SIZE = 9;
      const boardElement = document.querySelector("#board");
      const numberPad = document.querySelector("#number-pad");
      const message = document.querySelector("#message");
      const timerElement = document.querySelector("#timer");
      const difficulty = document.querySelector("#difficulty");
      const winModal = document.querySelector("#win-modal");
      const finalTime = document.querySelector("#final-time");
      const numberButtons = [];
      let solution = [];
      let puzzle = [];
      let values = [];
      let selected = -1;
      let elapsed = 0;
      let timerInterval;
      let finished = false;

      const shuffled = (items) => {
        const result = [...items];
        for (let i = result.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [result[i], result[j]] = [result[j], result[i]];
        }
        return result;
      };

      function makeSolution() {
        const bands = shuffled([0, 1, 2]);
        const rows = bands.flatMap((band) => shuffled([0, 1, 2]).map((row) => band * 3 + row));
        const stacks = shuffled([0, 1, 2]);
        const columns = stacks.flatMap((stack) => shuffled([0, 1, 2]).map((column) => stack * 3 + column));
        const digits = shuffled([1, 2, 3, 4, 5, 6, 7, 8, 9]);
        return rows.map((row) => columns.map((column) => digits[(row * 3 + Math.floor(row / 3) + column) % 9]));
      }

      function countSolutions(grid, limit = 2) {
        let bestRow = -1;
        let bestColumn = -1;
        let bestCandidates = null;

        for (let row = 0; row < SIZE; row++) {
          for (let column = 0; column < SIZE; column++) {
            if (grid[row][column] !== 0) continue;
            const used = new Set([
              ...grid[row],
              ...grid.map((line) => line[column]),
              ...grid.slice(Math.floor(row / 3) * 3, Math.floor(row / 3) * 3 + 3)
                .flatMap((line) => line.slice(Math.floor(column / 3) * 3, Math.floor(column / 3) * 3 + 3))
            ]);
            const candidates = [1, 2, 3, 4, 5, 6, 7, 8, 9].filter((number) => !used.has(number));
            if (candidates.length === 0) return 0;
            if (bestCandidates === null || candidates.length < bestCandidates.length) {
              bestRow = row;
              bestColumn = column;
              bestCandidates = candidates;
              if (candidates.length === 1) break;
            }
          }
          if (bestCandidates?.length === 1) break;
        }

        if (bestCandidates === null) return 1;
        let total = 0;
        for (const number of bestCandidates) {
          grid[bestRow][bestColumn] = number;
          total += countSolutions(grid, limit - total);
          grid[bestRow][bestColumn] = 0;
          if (total >= limit) return total;
        }
        return total;
      }

      function makePuzzle(level) {
        const targets = { easy: 36, medium: 46, hard: 52 };
        const result = makeSolution();
        const answer = result.map((row) => [...row]);
        let removed = 0;
        for (const index of shuffled(Array.from({ length: 81 }, (_, i) => i))) {
          if (removed >= targets[level]) break;
          const row = Math.floor(index / SIZE);
          const column = index % SIZE;
          const value = result[row][column];
          result[row][column] = 0;
          if (countSolutions(result.map((line) => [...line])) === 1) {
            removed++;
          } else {
            result[row][column] = value;
          }
        }
        return { puzzle: result, solution: answer };
      }

      function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60).toString().padStart(2, "0");
        const remainder = (seconds % 60).toString().padStart(2, "0");
        return `${minutes}:${remainder}`;
      }

      function getConflicts() {
        const conflicts = new Set();
        for (let index = 0; index < 81; index++) {
          const value = values[Math.floor(index / SIZE)][index % SIZE];
          if (!value) continue;
          const row = Math.floor(index / SIZE);
          const column = index % SIZE;
          for (let other = 0; other < 81; other++) {
            if (other === index) continue;
            const otherRow = Math.floor(other / SIZE);
            const otherColumn = other % SIZE;
            if (values[otherRow][otherColumn] !== value) continue;
            const sameRow = row === otherRow;
            const sameColumn = column === otherColumn;
            const sameBox = Math.floor(row / 3) === Math.floor(otherRow / 3)
              && Math.floor(column / 3) === Math.floor(otherColumn / 3);
            if (sameRow || sameColumn || sameBox) {
              conflicts.add(index);
              conflicts.add(other);
            }
          }
        }
        return conflicts;
      }

      function render() {
        const conflictCells = getConflicts();
        const selectedValue = selected < 0 ? 0 : values[Math.floor(selected / SIZE)][selected % SIZE];
        const selectedRow = Math.floor(selected / SIZE);
        const selectedColumn = selected % SIZE;

        for (let index = 0; index < 81; index++) {
          const row = Math.floor(index / SIZE);
          const column = index % SIZE;
          const cell = boardElement.children[index];
          const value = values[row][column];
          const classes = ["cell"];
          if (puzzle[row][column] !== 0) classes.push("given");
          if (selected >= 0 && (row === selectedRow || column === selectedColumn
            || (Math.floor(row / 3) === Math.floor(selectedRow / 3)
              && Math.floor(column / 3) === Math.floor(selectedColumn / 3)))) classes.push("related");
          if (selectedValue && value === selectedValue) classes.push("same-number");
          if (index === selected) classes.push("selected");
          if (conflictCells.has(index)) classes.push("conflict");
          cell.className = classes.join(" ");
          cell.textContent = value || "";
          cell.setAttribute("aria-label", `Row ${row + 1}, column ${column + 1}${value ? `, ${value}` : ", empty"}${puzzle[row][column] ? ", given" : ""}`);
          cell.setAttribute("aria-selected", String(index === selected));
          cell.tabIndex = index === selected || (selected === -1 && index === 0) ? 0 : -1;
        }

        for (let number = 1; number <= SIZE; number++) {
          const count = values.flat().filter((value) => value === number).length;
          numberButtons[number - 1].disabled = finished || count === 9;
          numberButtons[number - 1].setAttribute("aria-label", `Enter ${number}${count === 9 ? ", all used" : ""}`);
        }
      }

      function setMessage(text, isError = false) {
        message.textContent = text;
        message.classList.toggle("error", isError);
      }

      function checkWin() {
        if (getConflicts().size !== 0 || values.some((row) => row.includes(0))) return false;
        if (values.some((row, rowIndex) => row.some((value, columnIndex) => value !== solution[rowIndex][columnIndex]))) return false;
        finished = true;
        clearInterval(timerInterval);
        finalTime.textContent = formatTime(elapsed);
        winModal.hidden = false;
        setMessage("Puzzle complete!");
        render();
        return true;
      }

      function enterNumber(number) {
        if (selected < 0 || finished) {
          if (!finished) setMessage("Pick an empty square first", true);
          return;
        }
        const row = Math.floor(selected / SIZE);
        const column = selected % SIZE;
        if (puzzle[row][column] !== 0) {
          setMessage("That number is part of the puzzle", true);
          return;
        }
        values[row][column] = number;
        const conflicts = getConflicts();
        if (conflicts.has(selected)) {
          setMessage("That number conflicts with another square", true);
        } else {
          setMessage("Nice, keep going");
        }
        render();
        checkWin();
      }

      function eraseSelected() {
        if (selected < 0 || finished) return;
        const row = Math.floor(selected / SIZE);
        const column = selected % SIZE;
        if (puzzle[row][column] !== 0) return;
        values[row][column] = 0;
        setMessage("Square cleared");
        render();
      }

      function revealHint() {
        if (selected < 0 || finished) {
          if (!finished) setMessage("Pick an empty square for a hint", true);
          return;
        }
        const row = Math.floor(selected / SIZE);
        const column = selected % SIZE;
        if (puzzle[row][column] !== 0) {
          setMessage("Choose an empty square for a hint", true);
          return;
        }
        values[row][column] = solution[row][column];
        setMessage("One little nudge");
        render();
        checkWin();
      }

      function newGame() {
        finished = false;
        selected = -1;
        elapsed = 0;
        clearInterval(timerInterval);
        timerElement.textContent = formatTime(elapsed);
        winModal.hidden = true;
        ({ puzzle, solution } = makePuzzle(difficulty.value));
        values = puzzle.map((row) => [...row]);
        setMessage("Pick a square to get started");
        render();
        timerInterval = setInterval(() => {
          elapsed++;
          timerElement.textContent = formatTime(elapsed);
        }, 1000);
      }

      for (let index = 0; index < 81; index++) {
        const cell = document.createElement("button");
        cell.type = "button";
        cell.className = "cell";
        cell.setAttribute("role", "gridcell");
        cell.addEventListener("click", () => {
          if (finished) return;
          selected = index;
          setMessage(puzzle[Math.floor(index / SIZE)][index % SIZE] ? "That number is part of the puzzle" : "Choose a number");
          render();
        });
        boardElement.append(cell);
      }

      for (let number = 1; number <= SIZE; number++) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "number-button";
        button.textContent = number;
        button.addEventListener("click", () => enterNumber(number));
        numberButtons.push(button);
        numberPad.append(button);
      }

      document.querySelector("#erase").addEventListener("click", eraseSelected);
      document.querySelector("#hint").addEventListener("click", revealHint);
      document.querySelector("#new-game").addEventListener("click", newGame);
      document.querySelector("#play-again").addEventListener("click", newGame);
      difficulty.addEventListener("change", newGame);

      document.addEventListener("keydown", (event) => {
        if (event.altKey || event.ctrlKey || event.metaKey || event.target.matches("select, input, textarea")) return;
        if (/^[1-9]$/.test(event.key)) {
          event.preventDefault();
          enterNumber(Number(event.key));
          return;
        }
        if (event.key === "Backspace" || event.key === "Delete" || event.key === "0") {
          event.preventDefault();
          eraseSelected();
          return;
        }
        if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(event.key)) {
          event.preventDefault();
          if (selected < 0) selected = 0;
          else {
            const row = Math.floor(selected / SIZE);
            const column = selected % SIZE;
            if (event.key === "ArrowUp") selected = ((row + 8) % SIZE) * SIZE + column;
            if (event.key === "ArrowDown") selected = ((row + 1) % SIZE) * SIZE + column;
            if (event.key === "ArrowLeft") selected = row * SIZE + (column + 8) % SIZE;
            if (event.key === "ArrowRight") selected = row * SIZE + (column + 1) % SIZE;
          }
          setMessage("Choose a number");
          render();
          boardElement.children[selected].focus();
        }
      });

      newGame();
    })();
  </script>
</body>
</html>
